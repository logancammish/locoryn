[package]
name = "locoryn"
version = "1.3.0-beta"
edition = "2024"

[dependencies]
argon2 = "0.6.0"
ollama-rs = { version = "0.3.6", default-features = false, features = ["rustls", "stream"] }
tokio = { version = "1.53.1", features = ["full"] }
iced = { version = "0.14.0", features = ["advanced", "tokio", "image"]}
iced_widget = { version = "0.14.2", features = ["markdown", "highlighter"] }
webbrowser = "1.2.4"
crossbeam-channel = "0.5.17"
reqwest = { version = "0.13.5", features = ["blocking", "json", "hickory-dns"] }
async-trait = "0.1.92"
url = "2.5.8"
encoding_rs = "0.8.41"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive", "rc"] }
rustrict = "0.7.39"
chrono = "0.4.45"
image = "0.25.10"
iced_selection = { version = "0.5", features = ["markdown"] }
base64 = "0.23.1"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
rfd = "0.17.2"
pdf-extract = "0.12.0"

[target.'cfg(target_os = "linux")'.dependencies]
wl-clipboard-rs = "0.9.3"

[build-dependencies]
winresource = "0.1.31"

[profile.release]
opt-level = 2
lto = "thin"
